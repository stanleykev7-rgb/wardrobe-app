<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Wardrobe{% endblock %}</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; background: #fafafa; color: #222; }
    h1 { font-size: 1.6rem; }
    nav a { margin-right: 16px; text-decoration: none; color: #2563eb; font-weight: 600; }
    .flash { background: #fef3c7; border: 1px solid #f59e0b; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; }
    .card { background: white; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
    .item img { width: 100%; height: 140px; object-fit: cover; border-radius: 8px; }
    .item { font-size: 0.85rem; }
    .badge { display: inline-block; background: #eef2ff; color: #4338ca; padding: 2px 8px; border-radius: 999px; font-size: 0.75rem; margin-top: 4px; }
    form.upload { border: 2px dashed #cbd5e1; border-radius: 12px; padding: 20px; text-align: center; }
    button, input[type=submit] { background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    input[type=text] { padding: 8px; border-radius: 8px; border: 1px solid #cbd5e1; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('index') }}">Closet</a>
    <a href="{{ url_for('suggest') }}">Suggest outfit</a>
  </nav>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for m in messages %}
        <div class="flash">{{ m }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
